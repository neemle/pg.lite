name: release

# A tag is a PostgreSQL version: v9.0.0 builds PostgreSQL 9.0.0 (checksum-pinned in tools/releases.txt) with this
# repository's patches, and publishes
#   - the WebAssembly browser module as a downloadable archive (GitHub release + workflow artifact), and
#   - the static musl server as a FROM scratch Docker image on Docker Hub: <DOCKERHUB_REPOSITORY>:<version>.
# Nothing is built twice. The "plan" job looks for a successful run of ci.yml on the same files (the tested branch that was merged
# and tagged: scripts/ci-reuse.sh) and, when there is one, "publish" and "release" take the image and the WebAssembly archive from
# its artifacts. Only when there is none (the files differ, or the artifacts are older than their 7 days) the "ci" job calls ci.yml
# for the tagged version, which builds and tests once. The "publish" job pushes exactly those artifacts, only after all of it
# succeeded.
#
# Configure the repository variable DOCKERHUB_REPOSITORY (for example "myorg/pg.lite") and the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (an access token of Docker Hub with read and write permission on that repository); a tag build fails at once
# without them.
# Image tags, for the image with the executable compressed by xsfx: the exact version (9.0.0), the series when this is its newest
# release in tools/releases.txt (9.0), the family when it is the newest of it (9), and "latest" for the newest release of all.
# The same image with a plain executable has the same tags with the suffix -uncompressed (9.0.0-uncompressed, 9.0-uncompressed,
# 9-uncompressed; no latest-uncompressed).
# From 9.2.5 on (scripts/has-arm64.sh: where upstream PostgreSQL supports aarch64) every tag is multi-platform: the amd64 image and the
# arm64 image, each built and tested on its own runner, are pushed as <tag>-amd64 and <tag>-arm64 and joined under <tag>.
on:
  push:
    tags: ['v[0-9]*']
  # Started by hand (Actions > release > Run workflow): builds and tests the given version and keeps the files as workflow
  # artifacts, but publishes nothing (no image push, no release).
  workflow_dispatch:
    inputs:
      version:
        description: PostgreSQL version to build and test, for example 9.0.0 (dry run, nothing is published)
        required: true
      github-release:
        description: Only create the GitHub release of the existing tag v<version>, from the artifacts of the run that tested it (nothing is built, nothing is pushed to Docker Hub)
        type: boolean
        default: false
      full-backfill:
        description: "Publish ONLY the -full images (zlib, pg_dump, pg_restore; 17 and later) of the existing release v<version>, built from the files of this branch. The other tags and the GitHub release are not touched."
        type: boolean
        default: false

permissions:
  contents: write     # create the release and upload its files
  actions: read       # find the earlier run and download its artifacts

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      major: ${{ steps.plan.outputs.major }}
      family: ${{ steps.plan.outputs.family }}
      newestInMajor: ${{ steps.plan.outputs.newestInMajor }}
      newestInFamily: ${{ steps.plan.outputs.newestInFamily }}
      newestOverall: ${{ steps.plan.outputs.newestOverall }}
      publish: ${{ steps.publish.outputs.publish }}
      onlyFull: ${{ steps.publish.outputs.onlyFull }}
      ciRun: ${{ steps.reuse.outputs.run }}
      releaseOnly: ${{ steps.reuse.outputs.releaseOnly }}
      arm64: ${{ steps.arch.outputs.arm64 }}
      full: ${{ steps.arch.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.github-release && format('refs/tags/v{0}', inputs.version) || github.ref }}      # the tag, when only its release is created
          fetch-depth: 0       # the commits of the other branches, to compare their files with these
      - id: plan
        name: The tag must be an upstream PostgreSQL release this repository can build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          # a tag is v<version>; a manual run may say "latest" or a bare major, which builder.sh turns into a release
          [ "${TAG#v}" = "$TAG" ] || TAG="v$(./builder.sh version "${TAG#v}")"
          tools/dc sh scripts/release-plan.sh --github "$TAG" | tee -a "$GITHUB_OUTPUT"
      - id: arch
        name: Does this release get an arm64 image next to the amd64 one? (scripts/has-arm64.sh)
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if sh scripts/has-arm64.sh "$VERSION"; then echo "arm64=true" >> "$GITHUB_OUTPUT"; else echo "arm64=false" >> "$GITHUB_OUTPUT"; fi
          # from 17 on there is a full flavour of the image (zlib, pg_dump, pg_restore), published with the suffix -full
          if [ "${VERSION%%.*}" -ge 17 ]; then echo "full=true" >> "$GITHUB_OUTPUT"; else echo "full=false" >> "$GITHUB_OUTPUT"; fi
      - id: publish
        name: Only a pushed tag publishes (or a full-backfill run for a release that exists), and only with Docker Hub configured (checked now, not after an hour of building)
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          BACKFILL: ${{ inputs.full-backfill == true }}
          VERSION: ${{ steps.plan.outputs.version }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          publish=$IS_TAG; onlyfull=false
          if [ "$BACKFILL" = true ]; then
            # the -full tags of a release that was published without them: the tag v<version> must exist, and the release must be 17 or later
            git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "::error::full-backfill: there is no tag v$VERSION"; exit 1; }
            [ "${VERSION%%.*}" -ge 17 ] || { echo "::error::full-backfill: $VERSION has no full flavour (17 and later)"; exit 1; }
            publish=true; onlyfull=true
          fi
          if [ "$publish" = true ] && { [ -z "$DOCKERHUB_REPOSITORY" ] || [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; }; then
            echo "::error::Docker Hub is not configured: set the repository variable DOCKERHUB_REPOSITORY (for example myorg/pg.lite) and the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "onlyFull=$onlyfull" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: Earlier run of ci.yml that built and tested the same files (nothing is built then)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_ONLY: ${{ inputs.github-release }}
        run: |
          run=$(sh scripts/ci-reuse.sh "$VERSION")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "releaseOnly=$RELEASE_ONLY" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_ONLY" = true ] && [ -z "$run" ]; then
            echo "::error::No successful run of ci.yml has the files of the tag v$VERSION with artifacts that are still there (they live 7 days)."
            exit 1
          fi
          if [ -n "$run" ]; then
            echo "The image and the WebAssembly archive of the run $run are published: nothing is built again." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No earlier run for these files: building and testing first."
          fi

  # The build and the tests of both products are ci.yml, called for this version when no earlier run has them: built once, tested once.
  ci:
    needs: plan
    if: ${{ needs.plan.outputs.ciRun == '' }}
    uses: ./.github/workflows/ci.yml
    with:
      versions: ${{ format('["{0}"]', needs.plan.outputs.version) }}
      only-full: ${{ needs.plan.outputs.onlyFull }}

  publish:
    needs: [plan, ci]
    # ci is skipped when an earlier run is reused; a failed or cancelled one stops the release
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MAJOR: ${{ needs.plan.outputs.major }}
      FAMILY: ${{ needs.plan.outputs.family }}
      NEWEST_IN_MAJOR: ${{ needs.plan.outputs.newestInMajor }}
      NEWEST_IN_FAMILY: ${{ needs.plan.outputs.newestInFamily }}
      NEWEST_OVERALL: ${{ needs.plan.outputs.newestOverall }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      ARM64: ${{ needs.plan.outputs.arm64 }}
      FULL: ${{ needs.plan.outputs.full }}
      ONLY_FULL: ${{ needs.plan.outputs.onlyFull }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.onlyFull != 'true' }}
        with:
          name: image-${{ env.VERSION }}
          path: image
          run-id: ${{ needs.plan.outputs.ciRun || github.run_id }}      # the reused run, or this one
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.arm64 == 'true' && needs.plan.outputs.onlyFull != 'true' }}
        with:
          name: image-${{ env.VERSION }}-arm64
          path: image-arm64
          run-id: ${{ needs.plan.outputs.ciRun || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.full == 'true' }}
        with:
          name: image-${{ env.VERSION }}-full
          path: image-full
          run-id: ${{ needs.plan.outputs.ciRun || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.full == 'true' && needs.plan.outputs.arm64 == 'true' }}
        with:
          name: image-${{ env.VERSION }}-full-arm64
          path: image-full-arm64
          run-id: ${{ needs.plan.outputs.ciRun || github.run_id }}
          github-token: ${{ github.token }}
      - name: Load the tested images and give them their tags
        id: tags
        run: |
          # the compressed image: 9.0.0, 9.0, 9, latest; the plain one: 9.0.0-uncompressed, 9.0-uncompressed, 9-uncompressed
          tags="$VERSION"
          [ "$NEWEST_IN_MAJOR" = true ] && tags="$tags $MAJOR"
          [ "$NEWEST_IN_FAMILY" = true ] && tags="$tags $FAMILY"
          plain=""
          for t in $tags; do plain="$plain $t-uncompressed"; done
          [ "$NEWEST_OVERALL" = true ] && tags="$tags latest"
          # From 17 on the full flavour (zlib, pg_dump and pg_restore inside the executable) has the same tags with -full:
          # 17.11-full, 17-full, latest-full for the compressed one, 17.11-uncompressed-full, 17-uncompressed-full for the plain one.
          fulltags=""; fullplain=""
          if [ "$FULL" = true ]; then
            for t in $tags; do fulltags="$fulltags $t-full"; done
            for t in $plain; do fullplain="$fullplain $t-full"; done
          fi
          # a full-backfill run publishes the -full tags only: the other tags of the release stay as they are
          if [ "$ONLY_FULL" = true ]; then tags=""; plain=""; fi
          # A release with an arm64 image is published as one multi-platform tag (amd64 and arm64 under the same name). The two images
          # are pushed first under <tag>-amd64 and <tag>-arm64 and then joined; a release without arm64 is pushed under the tag itself.
          archtags=""
          # give the loaded images (pg.lite-image:...) their Docker Hub names; $1 is the suffix of the architecture tag, or empty
          retag() {
            for t in $tags; do docker tag "pg.lite-image:$VERSION" "$DOCKERHUB_REPOSITORY:$t$1"; done
            for t in $plain; do docker tag "pg.lite-image:$VERSION-uncompressed" "$DOCKERHUB_REPOSITORY:$t$1"; done
            if [ "$FULL" = true ]; then
              for t in $fulltags; do docker tag "pg.lite-image:$VERSION-full" "$DOCKERHUB_REPOSITORY:$t$1"; done
              for t in $fullplain; do docker tag "pg.lite-image:$VERSION-uncompressed-full" "$DOCKERHUB_REPOSITORY:$t$1"; done
            fi
            if [ -n "$1" ]; then for t in $tags $plain $fulltags $fullplain; do archtags="$archtags $t$1"; done; fi
          }
          if [ "$ARM64" = true ]; then
            [ "$ONLY_FULL" = true ] || gunzip -c "image/image-$VERSION.tar.gz" | docker load
            [ "$FULL" != true ] || gunzip -c "image-full/image-$VERSION-full.tar.gz" | docker load
            retag -amd64
            # the arm64 archives hold the images under the same names: load them second and tag them right away
            [ "$ONLY_FULL" = true ] || gunzip -c "image-arm64/image-$VERSION-arm64.tar.gz" | docker load
            [ "$FULL" != true ] || gunzip -c "image-full-arm64/image-$VERSION-full-arm64.tar.gz" | docker load
            retag -arm64
            for a in amd64 arm64; do
              for t in $tags $fulltags; do
                [ "$(docker image inspect "$DOCKERHUB_REPOSITORY:$t-$a" --format '{{.Architecture}}')" = "$a" ] || { echo "::error::$t-$a is not a $a image"; exit 1; }
              done
            done
          else
            [ "$ONLY_FULL" = true ] || gunzip -c "image/image-$VERSION.tar.gz" | docker load
            [ "$FULL" != true ] || gunzip -c "image-full/image-$VERSION-full.tar.gz" | docker load
            retag ""
          fi
          echo "tags=$tags $plain $fulltags $fullplain" >> "$GITHUB_OUTPUT"
          echo "archtags=$archtags" >> "$GITHUB_OUTPUT"
      - name: Push to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAGS: ${{ steps.tags.outputs.tags }}
          ARCHTAGS: ${{ steps.tags.outputs.archtags }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          if [ "$ARM64" = true ]; then
            for t in $ARCHTAGS; do docker push "$DOCKERHUB_REPOSITORY:$t"; done
            # one tag, two platforms
            for t in $TAGS; do docker buildx imagetools create -t "$DOCKERHUB_REPOSITORY:$t" "$DOCKERHUB_REPOSITORY:$t-amd64" "$DOCKERHUB_REPOSITORY:$t-arm64"; done
          else
            for t in $TAGS; do docker push "$DOCKERHUB_REPOSITORY:$t"; done
          fi
      - name: Check what was published (pull it back and look at it)
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker rmi "$DOCKERHUB_REPOSITORY:$t" >/dev/null 2>&1 || true
            if [ "$ARM64" = true ]; then
              # the tag lists both platforms (the arm64 image cannot run on this amd64 runner; it was tested on an arm64 runner)
              docker buildx imagetools inspect "$DOCKERHUB_REPOSITORY:$t" | tee /dev/stderr | grep -q 'Platform: *linux/amd64'
              docker buildx imagetools inspect "$DOCKERHUB_REPOSITORY:$t" | grep -q 'Platform: *linux/arm64'
            fi
            docker pull -q "$DOCKERHUB_REPOSITORY:$t"
            docker run --rm --entrypoint /usr/local/pgsql/bin/postgres "$DOCKERHUB_REPOSITORY:$t" --version | tee /dev/stderr | grep -q "(PostgreSQL) $VERSION"
            [ "$(docker image inspect "$DOCKERHUB_REPOSITORY:$t" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION" ]
            case "$t" in *-uncompressed|*-uncompressed-full) want=no ;; *) want=yes ;; esac
            [ "$(docker image inspect "$DOCKERHUB_REPOSITORY:$t" --format '{{index .Config.Labels "io.github.neemle.pglite.packed"}}')" = "$want" ]
            case "$t" in
              *-full) docker run --rm --entrypoint /usr/local/pgsql/bin/postgres "$DOCKERHUB_REPOSITORY:$t" --pg_dump --version | tee /dev/stderr | grep -q "(PostgreSQL) $VERSION" ;;
            esac
            echo "published $DOCKERHUB_REPOSITORY:$t"
          done

  release:
    needs: [plan, publish]
    # publish is skipped on a manual dry run; ci is skipped when an earlier run is reused, and a skipped job upstream would skip this one too.
    # A manual run with github-release creates only this release, for a tag that exists already (its images were published by the tag run).
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (needs.plan.result == 'success' && needs.plan.outputs.releaseOnly == 'true')) && needs.plan.outputs.onlyFull != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pg.lite-wasm-${{ needs.plan.outputs.version }}
          path: assets
          run-id: ${{ needs.plan.outputs.ciRun || github.run_id }}      # the reused run, or this one
          github-token: ${{ github.token }}
      - name: GitHub release with the browser module
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "PostgreSQL $VERSION (pg.lite)" \
            --notes "PostgreSQL $VERSION, minimal: WebAssembly browser module (this release) and the static musl image on Docker Hub: $DOCKERHUB_REPOSITORY:$VERSION. Checksums: the .sha256 file; upstream source SHA-256 is pinned in tools/releases.txt."
