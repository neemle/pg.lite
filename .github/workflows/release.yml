name: release

# A tag is a PostgreSQL version: v18.6 builds PostgreSQL 18.6 (checksum-pinned in sources.lock.json) with this
# repository's patches, and publishes
#   - the WebAssembly browser module as a downloadable archive (GitHub release + workflow artifact), and
#   - the static musl server as a FROM scratch Docker image: ghcr.io/<owner>/postgres:<version>, and on Docker Hub
#     when DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (secrets) and DOCKERHUB_REPOSITORY (variable, e.g. "org/postgres") are set.
# Image tags: the exact version (18.6) and, when it is the newest release of its major, the major (18); "latest" only
# for the newest release of all.  v16.x, v17.x and v18.x are parallel lines of drop-in replacements.
on:
  push:
    tags: ['v[0-9]*']
  # Started by hand (Actions > release > Run workflow): builds and tests the given version and keeps the files as workflow
  # artifacts, but publishes nothing (no image push, no release).
  workflow_dispatch:
    inputs:
      version:
        description: PostgreSQL version to build and test, for example 17.11 (dry run, nothing is published)
        required: true

permissions:
  contents: write     # create the release and upload its files
  packages: write     # push to ghcr.io

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      major: ${{ steps.plan.outputs.major }}
      newestInMajor: ${{ steps.plan.outputs.newestInMajor }}
      newestOverall: ${{ steps.plan.outputs.newestOverall }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: The tag must be an upstream PostgreSQL release this repository can build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: ./dc node scripts/release-plan.js --github "$TAG" | tee -a "$GITHUB_OUTPUT"
      - id: publish
        name: Only a pushed tag publishes
        run: echo "publish=${{ github.ref_type == 'tag' }}" >> "$GITHUB_OUTPUT"

  wasm:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the builder images and trees are several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && docker system prune -af >/dev/null && df -h /
      - name: Fetch the pinned upstream source (SHA-256 verified) and apply the patches
        run: |
          ./dc make fetch VERSION="$VERSION"
          ./dc make wasm-src VERSION="$VERSION"
      - name: Build the node-hosted WebAssembly server and the template data directory
        run: ./dcb wasm make wasm-build VERSION="$VERSION"
      - name: SQL smoke test under node
        run: ./dcb wasm make test-wasm-node VERSION="$VERSION"
      - name: Build the browser module
        run: WEB=1 ./dcb wasm make wasm-build VERSION="$VERSION"
      - name: Install the browser test dependencies and the demo's
        run: |
          DC_NET=1 ./dcb web sh scripts/web-install.sh tests/browser
          DC_NET=1 ./dcb web sh scripts/web-install.sh web/demo
      - name: Build the Angular + TypeORM demo
        run: ./dcb web make web-demo VERSION="$VERSION"
      - name: Browser tests (Chromium, real Worker, real IndexedDB)
        run: ./dcb web make test-wasm VERSION="$VERSION"
      - name: Package
        run: ./dc make package-wasm VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: compact-db-wasm-${{ env.VERSION }}
          path: |
            dist/compact-db-wasm-${{ env.VERSION }}.tar.gz
            dist/compact-db-wasm-${{ env.VERSION }}.tar.gz.sha256
            dist/compact-db-wasm-${{ env.VERSION }}.sizes.txt
          if-no-files-found: error

  image:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MAJOR: ${{ needs.plan.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && docker system prune -af >/dev/null && df -h /
      - name: Fetch the pinned upstream source and apply the patches
        run: |
          ./dc make fetch VERSION="$VERSION"
          ./dc make native-src VERSION="$VERSION"
      - name: Build the static musl server
        run: ./dcb musl make native-build VERSION="$VERSION"
      - name: Unit tests of the shell-free spawn code
        run: ./dcb musl make test-noshell VERSION="$VERSION"
      - name: Build the FROM scratch image and test it (SQL, modules, auth, restart, non-empty data directory, static check)
        run: |
          ./dcb ref make builder-check               # the reference builder image
          ./dcb ref make reference VERSION="$VERSION"
          scripts/reference.sh image "$VERSION"      # the unmodified upstream build whose psql is the external test client
          scripts/native-image.sh image "$VERSION"
          scripts/native-image.sh test "$VERSION"
      - name: Image tags
        id: tags
        env:
          NEWEST_IN_MAJOR: ${{ needs.plan.outputs.newestInMajor }}
          NEWEST_OVERALL: ${{ needs.plan.outputs.newestOverall }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          tags="$VERSION"
          [ "$NEWEST_IN_MAJOR" = true ] && tags="$tags $MAJOR"
          [ "$NEWEST_OVERALL" = true ] && tags="$tags latest"
          {
            echo "ghcr=ghcr.io/$owner/postgres"
            echo "tags=$tags"
            echo "hub=${DOCKERHUB_REPOSITORY}"
            if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_REPOSITORY" ]; then echo "hubready=true"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Push to ghcr.io
        if: ${{ needs.plan.outputs.publish == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in ${{ steps.tags.outputs.tags }}; do
            docker tag "compactdb-native:$VERSION" "${{ steps.tags.outputs.ghcr }}:$t"
            docker push "${{ steps.tags.outputs.ghcr }}:$t"
          done
      - name: Push to Docker Hub (when configured)
        if: ${{ needs.plan.outputs.publish == 'true' && steps.tags.outputs.hubready == 'true' }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          for t in ${{ steps.tags.outputs.tags }}; do
            docker tag "compactdb-native:$VERSION" "${{ steps.tags.outputs.hub }}:$t"
            docker push "${{ steps.tags.outputs.hub }}:$t"
          done
      - name: Image report
        run: docker image inspect "compactdb-native:$VERSION" --format 'image {{.Id}} {{.Size}} bytes' | tee "image-$VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-report-${{ env.VERSION }}
          path: image-${{ env.VERSION }}.txt

  release:
    needs: [plan, wasm, image]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compact-db-wasm-${{ needs.plan.outputs.version }}
          path: assets
      - name: GitHub release with the browser module
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "PostgreSQL $VERSION (compact.db)" \
            --notes "PostgreSQL $VERSION, minimal: WebAssembly browser module (this release) and the static musl image ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postgres:$VERSION. Checksums: the .sha256 file; upstream source SHA-256 is pinned in sources.lock.json."
