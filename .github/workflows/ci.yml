name: ci

# A pipeline with stages; a stage starts when the one before it passed, so nothing expensive runs on a broken tree, and nothing is
# built or tested twice:
#
#   plan     is there already a run that built and tested these very files? then everything below is skipped
#   checks   repo (self-tests) | typescript (types, oxlint, vitest)  | reference (the unmodified upstream image, cached)
#   build    build-cli (plain + compressed image, unit tests) | build-wasm (engine, browser module, demo, archive)
#   test     test-image (plain, compressed) | test-wasm (SQL under node, Chromium)
#
# What was built and tested is kept as workflow artifacts (image-<version>, pg.lite-wasm-<version>). The same files are never built
# again: merging a tested branch into main, tagging it, or changing only documentation finds the earlier run (scripts/ci-reuse.sh)
# and skips the build; release.yml publishes the artifacts of that run (publishing: release.yml). The artifacts live 7 days; after
# that, or when the files differ, a run builds.
on:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      versions:
        description: JSON list of the releases to build and test; empty means the releases this branch adds
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # a newer push to a branch replaces the run in progress; a tag run is never cancelled
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# DC_CACHE_VOLUME / DC_BUILD_VOLUME: folders on the runner instead of docker volumes, so that they can be cached and handed on
env:
  DC_CACHE_VOLUME: /home/runner/pglite-cache
  DC_BUILD_VOLUME: /home/runner/pglite-build
  # the releases this branch adds; the earlier ones were built and tested by their own branches
  DEFAULT_VERSIONS: '["9.0.3"]'

jobs:
  # ---- stage 0: is there anything to do?
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read       # to list the runs and their artifacts
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      reuse: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # the commits of the other branches, to compare their files with these
      - id: versions
        env:
          VERSIONS: ${{ inputs.versions || env.DEFAULT_VERSIONS }}
        run: echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: Earlier run that built and tested the same files (nothing is built then)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.versions.outputs.versions }}
        run: |
          list=$(echo "$VERSIONS" | tr -d '[]" ' | tr ',' ' ')     # ["9.0.0","9.0.1"] -> 9.0.0 9.0.1
          # shellcheck disable=SC2086
          run=$(sh scripts/ci-reuse.sh $list)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "Run $run built and tested these files: nothing is built again." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No earlier run for these files: building."
          fi

  # ---- stage 1: checks
  repo:
    needs: plan
    if: ${{ needs.plan.outputs.reuse == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Nothing runs on the runner but docker and git: every target runs in the project's tools container.
      - name: Self-tests (patch headers, wasm checks, no upstream source committed)
        run: tools/dc make selftest

  typescript:
    needs: plan
    if: ${{ needs.plan.outputs.reuse == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache (npm packages)
        uses: actions/cache@v6
        with:
          path: /home/runner/pglite-cache
          key: cache-ts-${{ hashFiles('wasm/**/package-lock.json') }}
          restore-keys: cache-ts-
      - name: "Browser module (TypeScript 7): types, oxlint, vitest"
        run: |
          DC_NET=1 tools/dcb web sh wasm/web-install.sh wasm
          tools/dcb web sh wasm/web-lib.sh typecheck
          tools/dcb web sh wasm/web-lib.sh lint
          tools/dcb web sh wasm/web-lib.sh test
      - name: "Demo (Angular 22): oxlint, vitest"
        run: |
          DC_NET=1 tools/dcb web sh wasm/web-install.sh wasm/demo
          tools/dcb web sh wasm/web-demo.sh lint
          tools/dcb web sh wasm/web-demo.sh test

  # The tests use the UNMODIFIED upstream build of the same release as their external client (image/reference.sh). It does not
  # depend on the patches, so it is built on the first run only and kept in the cache; the test jobs restore it.
  reference:
    needs: plan
    if: ${{ needs.plan.outputs.reuse == '' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache of the reference image
        id: refcache
        uses: actions/cache@v6
        with:
          path: reference-image.tar
          key: reference-${{ matrix.version }}-${{ hashFiles('tools/docker/builders/ref/**', 'image/docker/reference/**', 'image/reference.sh', 'image/build-reference.sh', 'tools/releases.txt', 'tools/release.env') }}
      - name: Cache (downloaded sources)
        if: ${{ steps.refcache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v6
        with:
          path: /home/runner/pglite-cache
          key: cache-ref-${{ matrix.version }}-${{ hashFiles('tools/releases.txt') }}
      - name: Build the reference image (only when it is not cached)
        if: ${{ steps.refcache.outputs.cache-hit != 'true' }}
        run: |
          ./builder.sh reference "${{ matrix.version }}"
          docker save "compactdb-reference:${{ matrix.version }}" -o reference-image.tar

  # ---- stage 2: build
  build-cli:
    needs: [plan, repo, typescript]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache (downloaded sources and packer)
        uses: actions/cache@v6
        with:
          path: /home/runner/pglite-cache
          key: cache-cli-${{ matrix.version }}-${{ hashFiles('tools/releases.txt', 'image/fetch-xsfx.sh') }}
          restore-keys: cache-cli-${{ matrix.version }}-
      - name: Disk space (cleaned only when less than 10 GB is free)
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$free_gb" -lt 10 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            docker system prune -af >/dev/null
            df -h /
          fi
      - name: Fetch the pinned upstream source (SHA-256 verified) and apply the patches
        run: ./builder.sh patch "$VERSION" cli
      - name: Build the static one-file server and the FROM scratch images (plain and compressed)
        run: ./builder.sh build "$VERSION" cli --pack
      - name: Unit tests (they need the build tree)
        run: ONLY_UNIT=1 ./builder.sh test "$VERSION" cli
      - name: Keep the images for the test jobs and for the release
        run: |
          docker tag "compactdb-native:$VERSION-min3-xsfx" "pg.lite-image:$VERSION"
          docker tag "compactdb-native:$VERSION-min3" "pg.lite-image:$VERSION-uncompressed"
          for i in "$VERSION" "$VERSION-uncompressed"; do
            docker image inspect "pg.lite-image:$i" --format "pg.lite-image:$i {{.Id}} {{.Size}} bytes" | tee -a "image-$VERSION.txt"
          done
          docker save "pg.lite-image:$VERSION" "pg.lite-image:$VERSION-uncompressed" "compactdb-native:$VERSION-min3" "compactdb-native:$VERSION-min3-xsfx" | gzip -9 > "image-$VERSION.tar.gz"
      - name: Disk space at the end (to see how much a job really needs)
        run: df -h /
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ env.VERSION }}
          path: |
            image-${{ env.VERSION }}.tar.gz
            image-${{ env.VERSION }}.txt
          if-no-files-found: error
          retention-days: 7

  build-wasm:
    needs: [plan, repo, typescript]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache (downloaded sources, npm packages)
        uses: actions/cache@v6
        with:
          path: /home/runner/pglite-cache
          key: cache-wasm-${{ matrix.version }}-${{ hashFiles('tools/releases.txt', 'wasm/**/package-lock.json') }}
          restore-keys: cache-wasm-${{ matrix.version }}-
      - name: Disk space (cleaned only when less than 10 GB is free)
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$free_gb" -lt 10 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            docker system prune -af >/dev/null
            df -h /
          fi
      - name: Fetch the pinned upstream source (SHA-256 verified) and apply the patches
        run: ./builder.sh patch "$VERSION" wasm
      - name: Build the engine, the browser module and the demo, and package them
        run: ./builder.sh build "$VERSION" wasm
      - name: Keep what the browser tests need (the build trees without the sources and objects)
        run: |
          tar -C "$DC_BUILD_VOLUME" -czf "wasm-build-$VERSION.tar.gz" --exclude="wasm/$VERSION/src" --exclude="wasm/$VERSION/obj" --exclude="wasm/$VERSION/obj-web" "wasm/$VERSION"
          ls -l "wasm-build-$VERSION.tar.gz"
          df -h /
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-build-${{ env.VERSION }}
          path: wasm-build-${{ env.VERSION }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v7
        with:
          name: pg.lite-wasm-${{ env.VERSION }}
          path: |
            tools/dist/pg.lite-wasm-${{ env.VERSION }}.tar.gz
            tools/dist/pg.lite-wasm-${{ env.VERSION }}.tar.gz.sha256
            tools/dist/pg.lite-wasm-${{ env.VERSION }}.sizes.txt
          if-no-files-found: error
          retention-days: 7

  # ---- stage 3: test
  test-image:
    needs: [plan, build-cli, reference]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
        image: [plain, compressed]
    env:
      VERSION: ${{ matrix.version }}
      SKIP_UNIT: '1'     # the unit tests ran in build-cli, next to the build tree
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.version }}
      - name: The reference image from the cache
        uses: actions/cache/restore@v6
        with:
          path: reference-image.tar
          key: reference-${{ matrix.version }}-${{ hashFiles('tools/docker/builders/ref/**', 'image/docker/reference/**', 'image/reference.sh', 'image/build-reference.sh', 'tools/releases.txt', 'tools/release.env') }}
      - name: Load the images
        run: |
          gunzip -c "image-$VERSION.tar.gz" | docker load
          # no cached reference image (evicted): the test builds it
          if [ -f reference-image.tar ]; then docker load -i reference-image.tar; fi
      - name: Test the image (SQL, modules, authentication, restart, environment, initdb.d, metadata, one file in the image)
        run: ./builder.sh test "$VERSION" cli ${{ matrix.image == 'compressed' && '--pack' || '' }}

  test-wasm:
    needs: [plan, build-wasm]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
      # the types, oxlint and vitest of the browser module ran in the "typescript" job; not again here
      SKIP_TS_CHECKS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Cache (npm packages)
        uses: actions/cache@v6
        with:
          path: /home/runner/pglite-cache
          key: cache-wasm-${{ matrix.version }}-${{ hashFiles('tools/releases.txt', 'wasm/**/package-lock.json') }}
          restore-keys: cache-wasm-${{ matrix.version }}-
      - uses: actions/download-artifact@v8
        with:
          name: wasm-build-${{ matrix.version }}
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: pg.lite-wasm-${{ matrix.version }}
          path: tools/dist
      - name: Put the build trees back
        run: |
          mkdir -p "$DC_BUILD_VOLUME"
          tar -C "$DC_BUILD_VOLUME" -xzf "artifacts/wasm-build-$VERSION.tar.gz"
      - name: Test (SQL under node; Chromium with a real Worker and real IndexedDB)
        run: ./builder.sh test "$VERSION" wasm
      - name: Browser test report (reports, videos and screenshots of every test)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests-${{ env.VERSION }}
          path: tools/reports/browser
          if-no-files-found: ignore
          retention-days: 7
